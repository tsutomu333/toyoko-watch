name: 接続テスト（一括確認）
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python - <<'PY'
          import checker
          w = {"hotels": [h for h,v in checker.HOTELS.items() if v["pref"]=="東京都"], "start":"2026-11-17","nights":1,"smoking":"all"}
          r = checker.fetch_prices(w)
          print("PROBE_OK", len(r), sum(v["vacant"] for v in r.values()))
          PY
