name: 東横イン空室ウォッチ

on:
  schedule:
    - cron: "13,43 * * * *"   # 予備の起動（GitHubの定期起動は遅れたり抜けたりするため）
  workflow_dispatch: {}       # 手動実行ボタン／前の実行からのリレー起動

permissions:
  contents: write
  actions: write              # 終了時に次の実行を自分で起動するため

concurrency:
  group: toyoko-watch
  cancel-in-progress: false   # 実行中なら次は待つ（二重実行しない）

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 空室チェック（約50分間、3分おきにループ）
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          INTERVAL_SEC: "180"
          DURATION_SEC: "3000"
        run: |
          git config user.name  "toyoko-watch-bot"
          git config user.email "toyoko-watch-bot@users.noreply.github.com"
          end=$(( $(date +%s) + DURATION_SEC ))
          while :; do
            started=$(date +%s)
            # スマホ画面で追加・削除された条件を取り込む
            git pull --rebase --quiet || git rebase --abort || true
            python checker.py || true
            if ! git diff --quiet -- state.json; then
              git add state.json
              git commit --quiet -m "state: $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
              for i in 1 2 3; do
                git pull --rebase --quiet && git push --quiet && break
                sleep 5
              done
            fi
            now=$(date +%s)
            [ $(( now + INTERVAL_SEC )) -gt $end ] && break
            sleep $(( INTERVAL_SEC - (now - started) > 0 ? INTERVAL_SEC - (now - started) : 0 ))
          done

      - name: 次の実行をリレー起動（途切れず監視を続けるため）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref main
